# configs/kinova_pi0_lora.yaml
# π0.5 LoRA fine-tuning for Kinova Gen3
# Hardware: 2x RTX 5090 (32GB each)

model:
  type: pi0
  action_dim: 7
  chunk_size: 12

data:
  repo_id: kinova_cube
  root: ~/lerobot_datasets
  train_split: train
  val_split: val
  image_key: observation.images.camera
  state_key: observation.state
  action_key: action

training:
  # Batch & GPU
  batch_size: 32                  # per GPU, 2 GPUs = 64 effective
  gradient_accumulation_steps: 1
  num_workers: 8

  # Learning
  lr: 1e-4
  lr_scheduler: cosine
  warmup_steps: 500
  num_epochs: 100
  seed: 42

  # LoRA
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

  # Mixed precision (5090 native BF16)
  mixed_precision: bf16

  # Save & Log
  checkpoint_dir: checkpoints/kinova_pi0_lora
  log_dir: logs/kinova_pi0_lora
  save_every_n_epochs: 10
  val_every_n_epochs: 5
  log_every_n_steps: 10

inference:
  horizon: 12
  steps: 10
  temperature: 0.8
  action_scale: 1.0