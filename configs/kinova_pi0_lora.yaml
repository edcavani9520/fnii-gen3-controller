# configs/kinova_pi0_lora.yaml
# π0.5 LoRA fine-tuning for Kinova Gen3 pick-place

model:
  type: pi0
  action_dim: 7
  chunk_size: 12

data:
  repo_id: kinova_cube
  root: ~/lerobot_datasets
  train_split: train
  val_split: val
  image_key: observation.images.camera
  state_key: observation.state
  action_key: action

training:
  batch_size: 16
  lr: 1e-4
  num_epochs: 100
  lora_rank: 32
  lora_alpha: 64
  seed: 42
  num_workers: 4
  checkpoint_dir: checkpoints/kinova_pi0_lora
  log_dir: logs/kinova_pi0_lora
  save_every_n_epochs: 10
  val_every_n_epochs: 5

inference:
  horizon: 12
  steps: 10
  temperature: 0.8